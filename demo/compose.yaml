services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prueba-portal-inscripciones-educativas-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${PORTAL_DEMO_SA_PASSWORD:?Set a temporary password for this demo}"
    ports:
      - "127.0.0.1:${PORTAL_DEMO_PORT:-11433}:1433"
